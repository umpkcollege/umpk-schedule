<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Расписание занятий — УМПК</title>
<meta name="description" content="Расписание занятий Уфимского многопрофильного профессионального колледжа для студентов и преподавателей.">
<!-- Значок вкладки и иконка в поисковой выдаче. Оба файла квадратные:
     неквадратную иконку Google и Яндекс пропускают и рисуют глобус.
     favicon.ico лежит в корне — поисковики спрашивают его, не читая разметку. -->
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/favicon.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Расписание УМПК">
<meta name="mobile-web-app-capable" content="yes">
<!-- ?v меняем, когда нужно наверняка выбить старую версию из кэша телефона -->
<link rel="stylesheet" href="styles.css?v=15">
<script>
  // Тему ставим до отрисовки, иначе на тёмном экране мигнёт белым.
  try {
    var saved = localStorage.getItem('umpk.theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) { /* приватный режим */ }
</script>
</head>
<body>

<header class="topbar">
  <!-- Поднимается, когда расписание пришло не из сети, а из сохранённой копии:
       иначе человек не отличит вчерашнее расписание от сегодняшнего. -->
  <div class="offline" id="offline" role="status" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3.5 8.5a9 9 0 0 1 4-2.2M12 5.5a9 9 0 0 1 8.5 3M6.8 12a6 6 0 0 1 2.3-1.4M15 11a6 6 0 0 1 2.2 1M10 15.2a2.5 2.5 0 0 1 4 0"/>
      <path d="M12 19h.01"/>
      <path d="M3 3l18 18"/>
    </svg>
    <span id="offline-text"></span>
  </div>

  <div class="topbar__inner">
    <a class="brand" href="#/" aria-label="На главную">
      <span class="brand__mark">
        <!-- Пока assets/logo.png не положен в папку, показываем векторную заглушку.
             У SVG нет свойства hidden, поэтому снимаем именно атрибут. -->
        <img id="logo" src="assets/logo.png" alt=""
             onerror="this.remove();document.getElementById('logo-fallback').removeAttribute('hidden');">
        <svg id="logo-fallback" hidden viewBox="0 0 200 200" role="img" aria-label="Логотип УМПК">
          <g>
            <polygon points="100,20 170,60 100,60" fill="#f4f4f4"/>
            <polygon points="170,60 100,100 100,60" fill="#e2e2e2"/>
            <polygon points="100,100 30,60 100,60" fill="#ececec"/>
            <polygon points="30,60 100,20 100,60" fill="#fafafa"/>
          </g>
          <g>
            <polygon points="30,60 100,100 65,120" fill="#1e9ad6"/>
            <polygon points="100,100 100,180 65,120" fill="#0d74b3"/>
            <polygon points="100,180 30,140 65,120" fill="#1189c9"/>
            <polygon points="30,140 30,60 65,120" fill="#4db2e8"/>
          </g>
          <g>
            <polygon points="100,100 170,60 135,120" fill="#22b322"/>
            <polygon points="170,60 170,140 135,120" fill="#17922a"/>
            <polygon points="170,140 100,180 135,120" fill="#2eb83a"/>
            <polygon points="100,180 100,100 135,120" fill="#6fd44a"/>
          </g>
        </svg>
      </span>
      <span class="brand__text">
        <strong class="brand__short">УМПК</strong>
        <span class="brand__full">Уфимский многопрофильный<br>профессиональный колледж</span>
      </span>
    </a>

    <div class="tools">
      <button class="icon-btn theme-toggle" id="theme-toggle" type="button">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
        </svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>
      </button>

      <button class="icon-btn install" type="button"
              aria-label="Установить как приложение" title="Установить как приложение">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11M8 10.5l4 4 4-4"/><path d="M4 17v2.5h16V17"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="app" class="page"></main>

<div class="modal" id="install-modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="install-title">
    <button class="modal__close" type="button" data-close aria-label="Закрыть">×</button>
    <h2 class="modal__title" id="install-title">Установить как приложение</h2>
    <p class="modal__lead">Расписание откроется с домашнего экрана как обычное
      приложение — без адресной строки и вкладок.</p>

    <button class="modal__action" id="install-now" type="button" hidden>Установить</button>

    <div class="steps" id="install-steps"></div>

    <p class="modal__note" id="install-note" hidden></p>
  </div>
</div>

<footer class="footer">
  <div class="footer__inner">
    <div class="footer__text">
      <p>© <span id="year"></span> Уфимский многопрофильный профессиональный колледж</p>
      <p class="footer__meta" id="footer-meta"></p>
    </div>
    <!-- Ссылку на «О расписании» убрали из подвала: студентам она не нужна.
         Страница осталась и открывается по адресу umpksch.ru/#/info —
         там видно, когда собирались данные и что не так с таблицами. -->

    <!-- Та самая папка, из которой сборка забирает таблицы. Адрес продублирован
         из CLOUD_PUBLIC_LINK в app/config.py: переедет папка — поправить нужно
         в обоих местах, иначе кнопка поведёт в никуда.
         Открываем новой вкладкой: из установленного на телефон приложения
         уход на чужой сайт выглядит как поломка, вернуться назад нечем. -->
    <a class="footer__cloud" href="https://cloud.mail.ru/public/KRh4/Q5UoGDxkv"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 18h10.5a3.5 3.5 0 0 0 .4-6.98 5.5 5.5 0 0 0-10.55-1.5A3.75 3.75 0 0 0 7 18Z"/>
      </svg>
      Таблицы в облаке
    </a>
  </div>
</footer>

<!-- ------------------------------- шаблоны ------------------------------- -->

<template id="tpl-home">
  <section class="hero">
    <h1 class="visually-hidden">Расписание занятий УМПК</h1>

    <div class="recent" id="home-pinned" hidden>
      <span class="recent__label">Закреплённые:</span>
      <div class="recent__items"></div>
    </div>

    <div class="cards">
      <a class="card" href="#/student">
        <svg class="card__icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path d="M226.53,56.41l-96-32a8,8,0,0,0-5.06,0l-96,32A8,8,0,0,0,24,64v80a8,8,0,0,0,16,0V75.1L73.59,86.29a64,64,0,0,0,20.65,88.05c-18,7.06-33.56,19.83-44.94,37.29a8,8,0,1,0,13.4,8.74C77.77,197.25,101.57,184,128,184s50.23,13.25,65.3,36.37a8,8,0,0,0,13.4-8.74c-11.38-17.46-27-30.23-44.94-37.29a64,64,0,0,0,20.65-88l44.12-14.7a8,8,0,0,0,0-15.18ZM176,120A48,48,0,1,1,89.35,91.55l36.12,12a8,8,0,0,0,5.06,0l36.12-12A47.89,47.89,0,0,1,176,120ZM128,87.57,57.3,64,128,40.43,198.7,64Z"/></svg>
        <h2 class="card__title">Я студент</h2>
        <p class="card__text">Расписание своей группы</p>
      </a>
      <a class="card" href="#/teacher">
        <svg class="card__icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H53.39a8,8,0,0,0,7.23-4.57,48,48,0,0,1,86.76,0,8,8,0,0,0,7.23,4.57H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40ZM80,144a24,24,0,1,1,24,24A24,24,0,0,1,80,144Zm136,56H159.43a64.39,64.39,0,0,0-28.83-26.16,40,40,0,1,0-53.2,0A64.39,64.39,0,0,0,48.57,200H40V56H216ZM56,96V80a8,8,0,0,1,8-8H192a8,8,0,0,1,8,8v96a8,8,0,0,1-8,8H176a8,8,0,0,1,0-16h8V88H72v8a8,8,0,0,1-16,0Z"/></svg>
        <h2 class="card__title">Я преподаватель</h2>
        <p class="card__text">Личное расписание пар</p>
      </a>
      <a class="card card--rooms" href="#/rooms">
        <svg class="card__icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path d="M56,24 H200 V216 H56 Z M72,40 V200 H184 V40 Z M156,112 H172 V144 H156 Z M32,224 H224 V240 H32 Z"/></svg>
        <h2 class="card__title">Аудитории</h2>
        <p class="card__text">Кто занимает кабинет</p>
      </a>
    </div>
    <p class="hero__note" id="home-note"></p>
    <p class="hero__updated" id="home-updated" hidden></p>
  </section>
</template>

<template id="tpl-picker">
  <section class="picker">
    <a class="back" href="#/">← На главную</a>
    <h1 class="picker__title"></h1>
    <p class="picker__lead"></p>

    <div class="recent" id="recent" hidden>
      <span class="recent__label">Недавние:</span>
      <div class="recent__items"></div>
    </div>

    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" autocomplete="off" spellcheck="false">
    </label>

    <div class="results" id="results"></div>
  </section>
</template>

<template id="tpl-schedule">
  <section class="schedule">
    <a class="back" id="back-link" href="#/student">← К списку</a>

    <header class="schedule__head">
      <h1 class="schedule__name"></h1>
      <div class="schedule__actions">
        <button class="act" id="pin-btn" type="button" hidden aria-pressed="false">
          <svg class="act__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.00 3.40 L14.09 9.13 L20.18 9.34 L15.38 13.10 L17.05 18.96 L12.00 15.55 L6.95 18.96 L8.62 13.10 L3.82 9.34 L9.91 9.13 Z"/>
          </svg>
          <span class="visually-hidden" id="pin-text">Закрепить на главной</span>
        </button>
        <button class="act" id="share-btn" type="button" hidden>
          <svg class="act__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12M8 6.5 12 3l4 3.5"/>
            <path d="M5 13v6.5h14V13"/>
          </svg>
          <svg class="act__done" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 12.5 4.5 4.5L19 7.5"/>
          </svg>
          <span class="visually-hidden share__text">Поделиться</span>
        </button>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab" data-view="today" role="tab">Сегодня</button>
      <button class="tab" data-view="tomorrow" role="tab">Завтра</button>
      <button class="tab" data-view="week" role="tab">Неделя</button>
    </div>

    <!-- кнопки опубликованных недель; собираются в app.js по данным сервера -->
    <div class="weekpick" id="weekpick" role="group" aria-label="Выбор недели" hidden></div>

    <div class="days" id="days"></div>
  </section>
</template>

<template id="tpl-info">
  <section class="info">
    <a class="back" href="#/">← На главную</a>
    <h1>О расписании</h1>
    <div id="info-body"></div>
  </section>
</template>

<script src="app.js?v=15"></script>
</body>
</html>

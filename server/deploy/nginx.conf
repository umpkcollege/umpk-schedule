# Вставить внутрь блока server { ... } сайта umpksch.ru (тот, что с listen 443),
# рядом с уже существующим location /. Обычно это файл в /etc/nginx/sites-enabled/.
# После правки:
#   sudo nginx -t && sudo systemctl reload nginx

location /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1k;
    access_log off;   # сигнал «я тут» раз в минуту от каждого — журнал бы распух
}

location = /admin {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
